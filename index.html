<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pet Keeper">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DCEFF7">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pet Keeper</title>
<style>
:root{--sky:#DCEFF7;--ink:#22304A;--grass:#58B368;--mint:#D5F0DA;--sun:#FFC83D;--berry:#E8567C;--lilac:#8E7CE0;--card:#fff;--muted:#586783}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--sky);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next Rounded",Nunito,"Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.4}
body{padding-top:env(safe-area-inset-top);min-height:100vh;min-height:100dvh}
#app{max-width:760px;margin:0 auto;padding:12px 14px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:0}
h2{font-size:22px;margin:0 0 6px}
h3{font-size:19px;margin:0 0 4px}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--lilac);outline-offset:2px}

header.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
header.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;background:#fff;padding:6px 14px;font-weight:800;min-height:44px}
.chip.sun{background:var(--sun)}
.chip.on{background:var(--mint)}
.iconbtn{width:48px;height:48px;border:3px solid var(--ink);border-radius:16px;background:#fff;font-size:22px;box-shadow:0 4px 0 var(--ink)}

.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:16px;margin:0 0 18px}
.card.mint{background:var(--mint)}
.card.sun{background:#FFF0BF}
.big{display:block;width:100%;min-height:64px;border:3px solid var(--ink);border-radius:20px;background:var(--berry);color:#fff;font-size:22px;font-weight:800;box-shadow:0 5px 0 var(--ink);padding:12px 16px}
.big:active,.btn:active,.iconbtn:active,.stamp:active,.face:active,.qo:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn{min-height:50px;border:3px solid var(--ink);border-radius:16px;background:#fff;font-weight:700;padding:8px 16px;box-shadow:0 4px 0 var(--ink)}
.btn.grass{background:var(--grass);color:#fff}
.btn.sun{background:var(--sun)}
.btn.berry{background:var(--berry);color:#fff}
.btn[disabled]{opacity:.45}
.ghost{min-height:48px;border:0;background:none;text-decoration:underline;font-weight:700;padding:8px}
.link{border:0;background:none;text-decoration:underline;font-weight:800;padding:0;color:var(--lilac)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>*{flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.fchip{min-height:44px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-weight:700;padding:4px 14px}
.fchip.on{background:var(--sun)}

/* layout */
.layout{display:block}
.side{display:none}
.layout.pet-tab .side{display:block}

/* speech bubble + scene */
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 14px;margin:0 0 16px;font-weight:600;font-size:17px;box-shadow:0 4px 0 var(--ink)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-12px;border:12px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bubble:before{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:#fff;border-bottom:0;z-index:1}
.qh{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:15px;margin-bottom:4px}
.qq{font-size:20px;font-weight:800;margin:2px 0 10px}
.qopts{display:grid;gap:8px}
.qo{min-height:54px;text-align:left;border:3px solid var(--ink);border-radius:16px;background:#fff;font-weight:700;padding:8px 14px;box-shadow:0 3px 0 var(--ink)}
.qo.ok{background:var(--mint)}
.qo.no{background:#FFD9DF}
.qo[disabled]{opacity:1;cursor:default}
.speak{min-height:40px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:18px;padding:0 10px}
.scene{position:relative;height:310px;border:3px solid var(--ink);border-radius:30px;overflow:hidden;box-shadow:0 6px 0 var(--ink);margin-bottom:20px}
.scene .deco{position:absolute;line-height:1;pointer-events:none}
.scene .pet{position:absolute;left:50%;bottom:4px;width:230px;height:240px;margin-left:-115px;animation:bob 3.2s ease-in-out infinite;cursor:pointer}
.scene .pet svg{width:100%;height:100%}
.scene .pet.jump{animation:jump .6s ease-out}
.lvl{position:absolute;right:12px;top:12px;z-index:2;text-align:center;background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:4px 10px;font-weight:800;line-height:1.15}
.lvl small{display:block;font-size:12px;font-weight:700}
.eyes{transform-origin:120px 108px;animation:blink 5s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-36px) scale(1.04)}100%{transform:translateY(0)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bar{height:22px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grass);transition:width .5s}

.groups{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grp{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:8px 2px;text-align:center;min-height:78px;font-weight:700;font-size:15px}
.grp span{display:block;font-size:30px;line-height:1.1;filter:grayscale(1);opacity:.45}
.grp.on{background:var(--mint)}
.grp.on span{filter:none;opacity:1}

.stamp{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:3px dashed var(--ink);border-radius:16px;background:#fff;padding:10px 12px;margin-top:10px;min-height:64px}
.stamp b{display:block}
.stamp .m{font-size:15px;color:var(--muted);font-weight:500}
.stamp .ic{font-size:30px;filter:grayscale(1);opacity:.4}
.stamp.on{border-style:solid;background:var(--sun);box-shadow:0 4px 0 var(--ink)}
.stamp.on .ic{filter:none;opacity:1}
.stamp.on .m{color:var(--ink)}
.rate{margin-top:12px;padding-top:10px;border-top:2px solid #E3E8F0}
.faces{display:flex;gap:12px;margin-top:8px}
.face{flex:1;min-height:104px;border:3px solid var(--ink);border-radius:20px;background:#fff;padding:4px 4px 8px;font-weight:700;font-size:15px;box-shadow:0 4px 0 var(--ink)}
.face svg{display:block;width:70px;height:70px;margin:0 auto 2px}
.face.on.h{background:var(--mint)}
.face.on.s{background:#FFD9DF}
.face.on.m{background:#FFF0BF}
.coins{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 12px}
.coin{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 0 var(--ink)}
.coin.used{background:#E6E9EF;opacity:.7;box-shadow:none}
.daygrid{display:flex;gap:6px;margin:8px 0 12px}
.daygrid div{text-align:center;flex:1}
.daygrid .dot{width:100%;aspect-ratio:1;max-width:56px;margin:0 auto 4px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:24px;background:#fff}
.daygrid .dot.today{background:var(--sun)}

details{border:3px solid var(--ink);border-radius:16px;background:#fff;margin:10px 0}
summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800;min-height:52px;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:26px}
details[open] summary::after{content:"−"}
details .in{padding:0 14px 12px}
details .tag{display:inline-block;font-size:13px;font-weight:700;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:0 8px;margin-right:4px}
ol.steps{margin:6px 0 10px;padding-left:24px}
ol.steps li{margin-bottom:6px}
.grid2{display:block}
select,input[type=text],input[type=number]{font:inherit;width:100%;min-height:52px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fff;color:var(--ink)}
.reward{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid #E3E8F0}
.reward:first-of-type{border-top:0}
.reward .e{font-size:32px}
.reward .t{flex:1}
.bigbal{font-size:44px;font-weight:900;line-height:1.05}
.logrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:2px solid #EEF1F6;font-size:16px}
.logrow:first-child{border-top:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--ink);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;gap:6px;width:100%;max-width:760px}
.tab{flex:1;border:3px solid transparent;border-radius:16px;background:none;min-height:60px;font-weight:700;font-size:14px;padding:4px 2px}
.tab span{display:block;font-size:26px;line-height:1.1}
.tab.on{background:var(--sun);border-color:var(--ink)}

.overlay{position:fixed;inset:0;background:rgba(34,48,74,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.overlay.hidden{display:none}
.sheet{background:var(--sky);border:3px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;width:100%;max-width:760px;max-height:88vh;max-height:88dvh;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:3px solid var(--ink);border-radius:18px;background:#fff;padding:12px 14px;margin-bottom:10px;min-height:64px;box-shadow:0 4px 0 var(--ink)}
.opt .e{font-size:34px}
.opt b{display:block}
.opt small{display:block;color:var(--muted);font-size:15px}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0 16px}
.dots i{width:24px;height:24px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dots i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto 10px}
.key{height:62px;border:3px solid var(--ink);border-radius:16px;background:#fff;font-size:26px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.key:active{transform:translateY(4px);box-shadow:none}
.center{text-align:center}

.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.pcard{border:3px solid var(--ink);border-radius:22px;background:#fff;padding:6px 6px 10px;text-align:center;font-weight:800;font-size:16px;box-shadow:0 5px 0 var(--ink)}
.pcard svg{width:100%;height:130px}
.pcard.sel{background:var(--sun)}
.syms{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0}
.scard{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:10px 4px;text-align:center;font-weight:700;font-size:15px;min-height:96px;box-shadow:0 4px 0 var(--ink)}
.scard span{display:block;font-size:34px}
.scard.sel{background:var(--sun)}
.mini{flex:0 0 46px;height:46px}
.bankart{padding:10px 10px 6px;background:var(--mint)}
.bankart svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.mini svg{width:46px;height:46px;display:block}

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.fx span{position:absolute;bottom:35%;font-size:30px;animation:pop 1.3s ease-out forwards}
@keyframes pop{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.2) rotate(40deg);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* landscape tablets and wide screens: character on the left, content on the right */
@media (min-width:700px) and (orientation:landscape){
  #app{max-width:1240px;padding-left:22px;padding-right:22px}
  .layout{display:grid;grid-template-columns:minmax(340px,40%) minmax(0,1fr);gap:24px;align-items:start}
  .side{display:block;position:sticky;top:8px;max-height:calc(100vh - 150px);overflow:auto;padding:4px 4px 10px}
  .scene{height:min(38vh,330px)}
  .qo{min-height:48px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;align-items:start}
  .grid2>details{margin:0}
  nav.tabs .in{max-width:1240px}
  .sheet{max-width:640px;border-radius:28px;border-bottom:3px solid var(--ink);margin-bottom:4vh}
  .overlay{align-items:center}
}
/* phones in landscape: keep it compact */
@media (orientation:landscape) and (max-height:560px){
  .scene{height:176px;margin-bottom:12px}
  .scene .pet{width:132px;height:138px;margin-left:-66px}
  .side{max-height:calc(100vh - 128px)}
  .bubble{font-size:16px;padding:8px 12px}
  header.top{padding-bottom:6px}
  .tab{min-height:50px}
  .tab span{font-size:20px}
}
@media (min-width:600px) and (orientation:portrait){
  #app{max-width:820px}
  .scene{height:340px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app"></div>
<div id="overlay" class="overlay hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

['b','🥣','Cereal with milk and fruit','gdf','Pour cereal and milk, top with banana or berries.','cereal, milk, fruit','k'],
['b','🍳','Egg and toast soldiers','pg','Soft-boil or fry an egg, cut toast into fingers for dipping.','egg, bread','ka'],

/* ============ day / week logic ============ */
const mealOK=m=>S.meals[m]&&S.meals[m].ate;
const mealSmile=m=>S.meals[m]&&S.meals[m].r==='h';
const smilesNow=()=>MEALS.filter(m=>mealSmile(m.k)).length;
const superNow=()=>MEALS.every(m=>mealOK(m.k)&&mealSmile(m.k))&&S.tokensUsed.length===0;
const weekSupers=()=>Math.max(0,Object.values(S.weekDays).filter(v=>v==='super').length+(superNow()?1:0)-Math.floor(S.weekClouds/3));
function rollover(){
  const t=todayStr();
  if(S.date===t)return;
  if(S.pet){
    const active=Object.keys(S.meals).length>0||S.tokensUsed.length>0;
    const wasSuper=superNow();
    if(active&&weekStartOf(new Date(S.date+'T12:00:00'))===S.weekStart)S.weekDays[S.date]=wasSuper?'super':'ok';
    if(wasSuper){earn(5,'Super Day!');S.notice='Yesterday was a Super Day! 🌟 +'+fmt(5)}
  }
  S.date=t;S.meals={};S.tokensUsed=[];S.rainbow=[];S.rainbowDone=false;S.listened=false;S.tonight='';
  if(S.lastBreakfast!==yesterdayStr())S.bStreak=0;
  const ws=weekStartOf(new Date());
  if(ws!==S.weekStart){S.weekStart=ws;S.weekDays={};S.weekClouds=0;S.weekBrave=0;S.braveBonus=false}
  save();
}

function pinPad(title,sub,onFour,shake){
  let v='';
  sheet(`<div class="center ${shake?'shake':''}"><h2>${title}</h2><p class="muted">${sub}</p><div class="dots" id="dots"></div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="key" data-k="${k}" aria-label="${k}">${k}</button>`).join('')}</div><button class="ghost" data-a="close">Cancel</button></div>`);
  const upd=()=>{document.getElementById('dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<v.length?'on':''}"></i>`).join('')};
  upd();
  document.querySelectorAll('#sheet .key').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=k;
    upd();
    if(v.length===4)setTimeout(()=>onFour(v),120);
  });
}
function withPin(cb){
  if(Date.now()<unlockedUntil){cb();return}
  if(!S.pin){setupPin(cb);return}
  askPin(cb,false);
}
function askPin(cb,again){
  pinPad('Grown-up check',again?'Not quite. Try again.':'Grown-ups only: enter the PIN',v=>{
    if(v===S.pin){unlockedUntil=Date.now()+5*60000;hideSheet();cb()}
    else askPin(cb,true);
  },again);
}
function setupPin(cb){
  pinPad('Set a grown-up PIN','Choose 4 digits. Only grown-ups use it, for settings and to create rewards.',a=>{
    pinPad('Confirm your PIN','Enter it once more',b=>{
      if(a===b){S.pin=a;save();unlockedUntil=Date.now()+5*60000;hideSheet();if(cb)cb();else render()}
      else setupPin(cb);
    });
  });
}

function sayNow(){
  if(petSay)return petSay;
  const n=S.pet.name,h=new Date().getHours();
  const left=S.tokensPerDay-S.tokensUsed.length;
  if(h<10&&!mealOK('breakfast'))return `Morning, ${n}! Breakfast helps me grow strong. Even a small start counts!`;
  if(left<=0)return 'Tokens are all used up. Fruit and cucumber are always open!';
  if(h>=20)return 'Night pets snack light. Water, a cuddle and sleep soon.';
  if(h>=17)return 'Dinner is a team mission: veg and protein first, then the rest.';
  if(h>=11&&h<14)return 'Lunch time! Pet food first, then the rest.';
  return 'I love being your friend! Tap me for a food quiz.';

function drawQuiz(){
  if(S.qDeck.length<5){
    const recent=S.qLast.slice(-20);
    let fresh=shuffle(QUIZ.map((_,i)=>i).filter(i=>!recent.includes(i)&&!S.qDeck.includes(i)));
    S.qDeck=S.qDeck.concat(fresh);
  }
  const ids=S.qDeck.splice(0,5);
  S.qLast=S.qLast.concat(ids).slice(-60);
  return ids;
}
function ensureQuiz(){
  if(S.quiz.date!==todayStr()){S.quiz={date:todayStr(),ids:drawQuiz(),i:0,right:0,done:false,bonus:false};save()}
}

  const cur=QUIZ[S.quiz.ids[S.quiz.i]];

/* ============ hungry ideas (deck, no repeats until all seen) ============ */
function mealBand(h){return h>=6&&h<10?'b':h>=11&&h<14?'l':h>=17&&h<20?'d':null}
function ideaPool(){
  const h=new Date().getHours(),night=h>=17,band=mealBand(h);
  let items=FOOD_BANK.filter(i=>i.t==='s'&&(!night||i.night));
  if(band)items=items.concat(FOOD_BANK.filter(i=>i.t===band));
  S.vault.filter(v=>v.menu&&(v.t==='s'||v.t===band)).forEach(v=>{if(!items.find(i=>i.id===v.id))items.push({id:v.id,t:v.t,e:v.e,n:v.n,g:[],how:'One of your own discoveries.',pan:'Your choice!',adult:false})});
  return {items,key:(night?'n':'d')+(band||'')};
}
function drawIdeas(n){
  const {items,key}=ideaPool(),ids=items.map(i=>i.id);
  let deck=(S.decks[key]||[]).filter(id=>ids.includes(id));
  if(deck.length<n){
    const recent=S.recent.slice(-10);
    let fresh=shuffle(ids.filter(id=>!recent.includes(id)&&!deck.includes(id)));
    if(deck.length+fresh.length<n)fresh=shuffle(ids.filter(id=>!deck.includes(id)));
    deck=deck.concat(fresh);
  }
  const out=deck.splice(0,n);
  S.decks[key]=deck;S.recent=S.recent.concat(out).slice(-40);save();
  return out.map(id=>items.find(i=>i.id===id));
}
function ideaSheet(){
  const night=new Date().getHours()>=17;
  sheet(`<h2>Ideas just for you</h2><p class="muted">${night?'Night pets snack light, so carbs are sleeping now.':'Pick one and fill your tummy with good stuff.'}</p>
  ${ideas.map((it,i)=>`<button class="opt" data-a="eat" data-v="${i}"><span class="e">${it.e}</span><span><b>${esc(it.n)}</b><small>${esc(it.how)}</small><small>${esc(it.pan)}${it.adult?' · ask a grown-up to help':''}</small></span></button>`).join('')}
  <div class="row"><button class="btn" data-a="more">Show me more ideas</button><button class="btn" data-a="close">Not now</button></div>`);
}

    save();ideas=[];closeSheet();toast('Yum! Great choice 🐾');checkRainbow();
  },
  filter(d){mealFilter=d.v;render()},
  surprise(){
    const pool=FOOD_BANK.filter(i=>!i.k&&!inVault(i.id));
    const it=pick(pool.length?pool:FOOD_BANK);
    sheet(`<div class="center"><div style="font-size:60px">${it.e}</div><h2>${esc(it.n)}</h2></div><p>${esc(it.how)}</p><p class="muted"><b>Pantry:</b> ${esc(it.pan)}${it.adult?'<br><b>Ask a grown-up to help.</b>':''}</p>
    <div class="row"><button class="btn grass" data-a="tryitem" data-v="${it.id}">I tried it! Deposit</button><button class="btn" data-a="surprise">Another one</button></div><div class="center"><button class="ghost" data-a="close">Close</button></div>`);
  },
  tryitem(d){const it=FOOD_BANK.find(i=>i.id===d.v);if(it)rateSheet(it)},
  deposit(){
    sheet(`<h2>🏦 Deposit a new food</h2><p class="muted">Tried something new? Type it in and tell us how it was.</p>
    <input type="text" id="dep-name" maxlength="40" placeholder="What did you try?" autocomplete="off"><div style="height:10px"></div>
    <select id="dep-type"><option value="x">Food</option><option value="s">Snack</option><option value="b">Breakfast</option><option value="l">Lunch</option><option value="d">Dinner</option></select>
    <p style="margin:12px 0 6px"><b>How was it?</b></p>
    <div class="faces">${[['happy','Loved it','3','h'],['meh','It was OK','2','m'],['sad','Not yet','1','s']].map(f=>`<button class="face ${f[3]}" data-a="depgo" data-v="${f[2]}">${charSVG(S.pet.id,1,f[0],true)}${f[1]}</button>`).join('')}</div>
    <div class="center"><button class="ghost" data-a="close">Cancel</button></div>`);
  },
  depgo(d){
    const name=(document.getElementById('dep-name').value||'').trim(),t=document.getElementById('dep-type').value;
    if(!name){toast('Type what you tried first');return}
    const r=+d.v,it={id:'c_'+Date.now(),n:name,t,e:TYPE_EMOJI[t],r};
    deposit(it);
  },
  rateit(d){const it=Object.assign({},rateSheet.item,{r:+d.v2});deposit(it)},
  menu(d){const v=inVault(d.v);if(v){v.menu=!v.menu;save();render();toast(v.menu?'Added to your menu 🍽️':'Removed from menu')}},
  buy(d){
    const r=S.rewards.find(x=>x.id===d.v);if(!r||S.balance<r.c)return;
    sheet(`<div class="center"><div style="font-size:56px">${r.e}</div><h2>${esc(r.n)}</h2><p>Spend ${sy()[0]} ${r.c} on this? Tell a grown-up so they can make it happen!</p></div><button class="big" data-a="buyok" data-v="${r.id}" style="background:var(--grass);margin-bottom:10px">Yes, get it!</button><div class="center"><button class="ghost" data-a="close">Not yet</button></div>`);
  },
  buyok(d){
    const r=S.rewards.find(x=>x.id===d.v);if(!r||S.balance<r.c){closeSheet();return}
    S.balance-=r.c;logIt(-r.c,'Got: '+r.n);save();fx();closeSheet();toast('Enjoy: '+r.n+' 🎁');
  },
  rewardsmgr(){withPin(()=>rewardsSheet())},
  rwadd(){
    const n=(document.getElementById('rw-name').value||'').trim(),c=Math.max(1,parseInt(document.getElementById('rw-cost').value,10)||0),e=(document.getElementById('rw-emoji').value||'').trim()||'🎁';
    if(!n||!c){toast('Add a name and a cost');return}
    S.rewards.push({id:'r'+Date.now(),e,n,c});save();rewardsSheet();
  },
  rwdel(d){S.rewards=S.rewards.filter(r=>r.id!==d.v);save();rewardsSheet()},
  grown(){withPin(()=>grownSheet())},
  tokdelta(d){S.tokensPerDay=Math.max(1,Math.min(4,S.tokensPerDay+(+d.v)));save();grownSheet()},
  needdelta(d){S.sweetNeed=Math.max(1,Math.min(7,S.sweetNeed+(+d.v)));save();grownSheet()},
  givebonus(){const n=parseInt(document.getElementById('bonus-n').value,10);if(!n)return;if(n>0)earn(n,'Bonus from a grown-up');else{S.balance=Math.max(0,S.balance+n);logIt(n,'Adjustment');save()}grownSheet();toast('Done')},
  changepin(){S.pin=null;unlockedUntil=0;setupPin(null)},
  resettoday(){S.meals={};S.tokensUsed=[];S.rainbow=[];S.rainbowDone=false;S.listened=false;save();closeSheet();toast('Today reset')},
  resetall(){if(confirm('Erase the character, balance and Food Bank? This cannot be undone.')){const pin=S.pin;S=defaults();S.pin=pin;draft={char:null,name:'',sym:null,step:1};qUI={mode:'idle',opts:[],picked:null};save();closeSheet()}}
};
function grownSheet(){
  sheet(`<h2>Grown-ups</h2>
  <div class="card"><b>Treat tokens per day</b><div class="row" style="margin-top:8px;align-items:center"><button class="btn" data-a="tokdelta" data-v="-1">−</button><div class="center"><b style="font-size:26px">${S.tokensPerDay}</b></div><button class="btn" data-a="tokdelta" data-v="1">+</button></div></div>
  <div class="card"><b>Super Days needed for Sweet Saturday</b><div class="row" style="margin-top:8px;align-items:center"><button class="btn" data-a="needdelta" data-v="-1">−</button><div class="center"><b style="font-size:26px">${S.sweetNeed}</b></div><button class="btn" data-a="needdelta" data-v="1">+</button></div></div>
  <div class="card"><b>Give or take ${esc(sy()[2])}</b><div class="row" style="margin-top:8px"><input type="number" id="bonus-n" placeholder="e.g. 5 or -5" inputmode="numeric"><button class="btn grass" data-a="givebonus">Apply</button></div></div>
  <button class="opt" data-a="rewardsmgr"><span class="e">🎁</span><span><b>Manage rewards</b><small>Add, price and remove</small></span></button>
  <button class="opt" data-a="changepin"><span class="e">🔑</span><span><b>Change PIN</b></span></button>
  <button class="opt" data-a="resettoday"><span class="e">🔄</span><span><b>Reset today</b><small>Clears today's stamps, smiles, tokens and rainbow</small></span></button>
  <button class="opt" data-a="resetall"><span class="e">🗑️</span><span><b>Start over</b><small>Erases character, balance and Food Bank</small></span></button>
  <div class="card mint"><b>Tip</b><br>Praise the effort and the character, not weight or body size. Honest sad faces are fine and are never punished.</div>
  <div class="center"><button class="btn" data-a="close">Done</button></div>`);
}
function rewardsSheet(){
  sheet(`<h2>🎁 Rewards</h2><p class="muted">Add things she can save up for, and set the price.</p>
  ${S.rewards.map(r=>`<div class="reward"><span class="e">${r.e}</span><span class="t"><b>${esc(r.n)}</b><br><span class="muted">${sy()[0]} ${r.c}</span></span><button class="btn berry" data-a="rwdel" data-v="${r.id}">Remove</button></div>`).join('')||'<p class="muted">No rewards yet.</p>'}
  <div class="card" style="margin-top:12px"><b>Add a reward</b>
  <input type="text" id="rw-name" maxlength="40" placeholder="Reward name" style="margin:8px 0" autocomplete="off">
  <div class="row"><input type="number" id="rw-cost" placeholder="Cost" inputmode="numeric"><input type="text" id="rw-emoji" maxlength="4" placeholder="Emoji (optional)"></div>
  <div style="height:10px"></div><button class="btn grass" data-a="rwadd" style="width:100%">Add reward</button></div>
  <div class="center"><button class="btn" data-a="close">Done</button></div>`);
}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');
  if(a&&actions[a.dataset.a]){actions[a.dataset.a](a.dataset);return}
  if(e.target.id==='overlay')closeSheet();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.input;
  if(k==='name')draft.name=e.target.value;
  if(k==='mq'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.bankwrap details').forEach(d=>{d.style.display=(!q||d.dataset.name.includes(q))?'':'none'})}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
if('serviceWorker' in navigator){
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=4').then(r=>r.update()).catch(()=>{}));
}
render();
</script>
</body>
</html>
